---
- name: Verify
  hosts: all
  vars:
    docker_storage_driver: overlay2
  tasks:
    - name: Assert storage driver default is overlay2
      ansible.builtin.assert:
        that:
          - docker_storage_driver == "overlay2"
        fail_msg: "docker_storage_driver default should be overlay2, got: {{ docker_storage_driver }}"

    - name: Gather daemon.json contents (if present)
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: _daemon_json_raw
      ignore_errors: true

    - name: Assert storage-driver key in daemon.json when config is present
      ansible.builtin.assert:
        that:
          - (_daemon_json_raw.content | b64decode | from_json)['storage-driver'] == docker_storage_driver
        fail_msg: >-
          daemon.json storage-driver mismatch: expected {{ docker_storage_driver }},
          got {{ (_daemon_json_raw.content | b64decode | from_json).get('storage-driver', 'not set') }}
      when:
        - not _daemon_json_raw.failed
        - docker_storage_driver | length > 0
