---
- name: Debian | Updating apt-cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400
  become: true
  register: result
  until: result is successful

- name: Debian | Installing pre-reqs
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
    state: present
  become: true
  register: result
  until: result is successful

# We are removing the old Docker info
- name: Debian | Removing legacy Docker apt-key
  ansible.builtin.apt_key:
    keyserver: hkp://p80.pool.sks-keyservers.net:80
    id: 58118E89F3A912897C070ADBF76221572C52609D
    state: absent
  become: true

# We are removing the old Docker info
- name: Debian | Removing legacy Docker repo
  ansible.builtin.apt_repository:
    repo: "deb https://apt.dockerproject.org/repo {{ ansible_distribution | lower }}-{{ ansible_distribution_release }} main"
    state: absent
  become: true

- name: Debian | Adding Docker apt-key
  ansible.builtin.apt_key:
    url: "{{ docker_ubuntu_repo_info['url'] }}"
    id: "{{ docker_ubuntu_repo_info['id'] }}"
    state: present
  become: true
  register: result
  until: result is successful

- name: Debian | Adding Docker repo
  ansible.builtin.apt_repository:
    repo: "{{ docker_ubuntu_repo_info['repo'] }}"
    state: present
  become: true
  register: result
  until: result is successful

# We remove docker-engine as this is old package to install. The new package is
# docker-ce
- name: Debian | Uninstalling old Docker packages (if exists)
  ansible.builtin.apt:
    name:
      - containerd
      - docker
      - docker-engine
      - docker.io
      - lxc-docker
      - runc
    state: absent
    purge: true
  become: true
  register: result
  until: result is successful

- name: Debian | Checking for existing Docker # noqa command-instead-of-shell
  ansible.builtin.shell: dpkg-query -W 'docker-ce'
  ignore_errors: true
  register: has_docker
  changed_when: false

- name: Debian | Installing Docker (pinned version)
  ansible.builtin.apt:
    name:
      - containerd.io
      - "docker-ce={{ docker_version_debian }}"
    state: present
  become: true
  register: result
  until: result is successful
  when:
    - docker_version | lower != "latest"
    - has_docker is failed

- name: Debian | Installing Docker (latest)
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-ce
    state: present
  become: true
  register: result
  until: result is successful
  when:
    - docker_version | lower == "latest"
    - has_docker is failed

- name: Debian | Checking for /etc/default/grub
  ansible.builtin.stat:
    path: /etc/default/grub
  register: _docker_grub_check

- name: Debian | Setting grub memory limit (if set)
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX_DEFAULT"
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="cgroup_enable=memory swapaccount=1"'
  register: grub_updated
  become: true
  when:
    - _docker_grub_check['stat']['exists']
    - docker_set_grub_memory_limit is defined
    - docker_set_grub_memory_limit

- name: Debian | Updating grub (if updated) # noqa no-handler
  ansible.builtin.command: update-grub
  become: true
  changed_when: true
  when: grub_updated is defined and grub_updated['changed']

- name: Debian | Installing bridge-utils
  ansible.builtin.apt:
    name: bridge-utils
    state: present
  become: true
  register: result
  until: result is successful
  when:
    - docker_install_bridge_utils is defined
    - docker_install_bridge_utils
