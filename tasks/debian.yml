---
- name: Debian | Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400
  become: true
  register: result
  until: result is successful

- name: Debian | Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
  become: true
  register: result
  until: result is successful

# Remove legacy apt-key and repo entries if present
- name: Debian | Remove legacy Docker apt-key
  ansible.builtin.apt_key:
    keyserver: hkp://p80.pool.sks-keyservers.net:80
    id: 58118E89F3A912897C070ADBF76221572C52609D
    state: absent
  become: true

- name: Debian | Remove legacy Docker repo
  ansible.builtin.apt_repository:
    repo: "deb https://apt.dockerproject.org/repo {{ ansible_distribution | lower }}-{{ ansible_distribution_release }} main"
    state: absent
  become: true

- name: Debian | Remove legacy Docker trusted.gpg keyring entry
  ansible.builtin.apt_key:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    state: absent
  become: true
  failed_when: false

- name: Debian | Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Debian | Download Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  become: true
  register: result
  until: result is successful

- name: Debian | Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release | lower }} {{ docker_release_channel }}
    filename: docker
    state: present
  become: true
  register: result
  until: result is successful

- name: Debian | Remove old Docker packages
  ansible.builtin.apt:
    name:
      - containerd
      - docker
      - docker-engine
      - docker.io
      - lxc-docker
      - runc
    state: absent
    purge: true
  become: true
  register: result
  until: result is successful

- name: Debian | Check for existing Docker installation
  ansible.builtin.command: dpkg-query -W docker-ce
  ignore_errors: true
  register: has_docker
  changed_when: false

- name: Debian | Install Docker (pinned version)
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-ce-cli
      - "docker-ce={{ docker_version_debian }}"
    state: present
  become: true
  register: result
  until: result is successful
  when:
    - docker_version | lower != "latest"
    - has_docker is failed

- name: Debian | Install Docker (latest)
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-ce-cli
      - docker-ce
    state: present
  become: true
  register: result
  until: result is successful
  when:
    - docker_version | lower == "latest"
    - has_docker is failed

- name: Debian | Check for /etc/default/grub
  ansible.builtin.stat:
    path: /etc/default/grub
  register: _docker_grub_check

- name: Debian | Set grub memory limit
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX_DEFAULT"
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="cgroup_enable=memory swapaccount=1"'
  register: grub_updated
  become: true
  when:
    - _docker_grub_check.stat.exists
    - docker_set_grub_memory_limit is defined
    - docker_set_grub_memory_limit

- name: Debian | Update grub
  ansible.builtin.command: update-grub
  become: true
  changed_when: true
  when: grub_updated is defined and grub_updated.changed

- name: Debian | Install bridge-utils
  ansible.builtin.apt:
    name: bridge-utils
    state: present
  become: true
  register: result
  until: result is successful
  when:
    - docker_install_bridge_utils is defined
    - docker_install_bridge_utils
